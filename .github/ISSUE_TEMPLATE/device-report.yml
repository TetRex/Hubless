name: Device report
description: Help add support for a Logitech device (mouse, keyboard, headset, receiver).
title: "Device report: "
labels: ["device report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! Create the report in Hubless: **Settings → Device report → Create report**
        (or run `hubless --report`). Close G Hub completely first.
        The report only reads from your devices and contains no serial numbers or personal data.
  - type: input
    id: device
    attributes:
      label: Device model
      description: As printed on the device or the box.
      placeholder: e.g. G502 X Plus
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      multiple: true
      options:
        - LIGHTSPEED receiver
        - Unifying receiver
        - Bolt receiver
        - USB cable
        - Bluetooth
    validations:
      required: true
  - type: textarea
    id: works
    attributes:
      label: What works and what doesn't
      description: Which cards and settings in Hubless behave correctly, and what is missing or wrong.
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Attach the report file (drag it here) or paste its text (Settings → Device report → Copy).
      render: text
    validations:
      required: true
